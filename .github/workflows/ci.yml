name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships shellcheck; install only if it is missing.
      - name: Ensure shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # bash -n only syntax-checks its first file argument, so loop.
      - name: Syntax check (bash -n)
        run: |
          for f in install.sh uninstall.sh lib/*.sh tools/*.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck (-S warning)
        run: shellcheck -S warning install.sh uninstall.sh lib/*.sh tools/*.sh tests/*.sh

      # Everything is mocked; the tests run unprivileged.
      - name: Run tests
        run: |
          for t in tests/*.sh; do
            echo "== $t =="
            bash "$t"
          done

      # Fail if a tracked file is missing from the "## Repository layout"
      # tree in README.md, so a new file cannot rot out of the diagram.
      # Extracted to a script so `make test` runs the same check locally.
      - name: README repository-layout tree is current
        run: bash tools/check-layout-tree.sh

      # Fail if any markdown link is broken — in-page anchors, relative
      # .md targets, and cross-file anchors, across every tracked *.md
      # file (GitHub slug rules, fence-aware, duplicate -N suffixing).
      # Non-markdown targets and external URLs are out of scope by
      # design; see tools/check-links.sh.
      - name: Markdown links resolve
        run: bash tools/check-links.sh

      # Fail if the version string disagrees between dkms.conf,
      # install.sh, src/x120x.c, and the hardcoded refs in
      # docs/manual-install.md — previously enforced only by the
      # RELEASING.md checklist.
      - name: Version strings agree
        run: bash tools/check-versions.sh

  # Compile-check the module against the runner's stock generic headers and
  # the newest HWE headers.  Compile only — the module is never loaded.
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [generic, hwe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install headers (${{ matrix.flavor }})
        run: |
          sudo apt-get update
          if [ "${{ matrix.flavor }}" = hwe ]; then
            sudo apt-get install -y build-essential "linux-headers-generic-hwe-$(lsb_release -rs)" \
              || sudo apt-get install -y build-essential linux-headers-generic
          else
            sudo apt-get install -y build-essential linux-headers-generic
          fi

      # KCFLAGS=-Werror turns any compiler warning into a failure.
      - name: Compile-check the module (-Werror)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          echo "Building against $KDIR"
          make KDIR="$KDIR" KCFLAGS=-Werror

  # Oldest supported LTS kernel via container, to catch regressions against
  # kernels older than the runner's.  The driver requires a modern kernel
  # (~6.3+: the one-arg i2c .probe, the sys-off handler framework, and the
  # void i2c .remove), so an older LTS such as Ubuntu 22.04 / 5.15 is below
  # the floor and is deliberately not tested.  24.04 ships 6.8.
  build-lts:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y build-essential linux-headers-generic make

      - name: Compile-check against 24.04 generic (-Werror)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          echo "Building against $KDIR"
          make KDIR="$KDIR" KCFLAGS=-Werror

  # armhf (32-bit) cross toolchain.  A kernel module cannot be compiled
  # without a configured kernel tree for the target arch, and Ubuntu's x86
  # runners ship no armhf/RPi kernel headers (linux-headers-*:armhf pulls an
  # armhf kernel that will not resolve on x86).  We do NOT fake a build: this
  # job verifies the cross toolchain installs; real armhf results come from
  # users via the hardware-report issue template.
  build-armhf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install armhf cross toolchain (crossbuild-essential-armhf)
        run: sudo apt-get update && sudo apt-get install -y crossbuild-essential-armhf

      - name: Verify toolchain (ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-)
        run: |
          arm-linux-gnueabihf-gcc --version | head -1
          echo "armhf kernel-module build is not run here — no armhf kernel tree on x86 runners (see job comment)."

  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install device-tree-compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      # Errors fail the job; dtc warnings are allowed (dtc exits 0 on them).
      - name: Compile the device tree overlay
        run: dtc -@ -I dts -O dtb -o /tmp/x120x.dtbo x120x-overlay.dts

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build deps + sparse
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic sparse

      # W=1 enables kernel extra-warning checks (incl. kernel-doc).  They do
      # not fail the build on their own, so grep the output and fail on any.
      # KCFLAGS=-Werror additionally turns compiler warnings into errors.
      - name: make W=1 (warnings fail)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          echo "Building against $KDIR"
          make KDIR="$KDIR" W=1 KCFLAGS=-Werror 2>&1 | tee w1.log
          # Ignore the benign Kbuild "compiler differs from the one used to
          # build the kernel" environment notice; fail on any real warning.
          warns=$(grep -iE 'warning' w1.log | grep -viE 'compiler differs from the one used to build the kernel' || true)
          if [ -n "$warns" ]; then echo "W=1 warnings:"; printf '%s\n' "$warns"; exit 1; fi

      # sparse prints findings but exits 0; fail on any on our source.
      - name: sparse (make C=1)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          make KDIR="$KDIR" C=1 2>&1 | tee sparse.log
          if grep -qE 'x120x\.c.*(warning|error)' sparse.log; then echo "sparse findings"; exit 1; fi

  # Validate the DT binding schema — the one artifact aimed squarely at
  # upstreaming.  dt-doc-validate checks the binding against dtschema's
  # meta-schema.  It prints an informational note that the $id path does
  # not match the file's location (the binding lives at the repo root,
  # not at its eventual Documentation/devicetree/bindings/ path); that
  # note does not fail the check.
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dtschema
        # pylibfdt (a dtschema dependency) ships no wheel; its sdist
        # builds a _libfdt that links the Python 2 symbol PyInt_AsLong
        # under the runner's Python 3.12, so dt-doc-validate crashes on
        # import (broke 2026-08).  Take libfdt from the distro's prebuilt
        # python3-libfdt and install dtschema's remaining deps explicitly.
        run: |
          sudo apt-get update && sudo apt-get install -y python3-libfdt
          pip3 install --no-deps dtschema==2026.6
          pip3 install "ruamel.yaml>0.15.69" "jsonschema>=4.18" rfc3987

      - name: Validate binding (dt-doc-validate)
        run: dt-doc-validate suptronics,x120x.yaml

  # Kernel style check.  checkpatch.pl is fetched pinned to a kernel
  # tag from GitHub's mirror of torvalds/linux — no kernel tree
  # checkout needed (--no-tree).  Three message types are ignored as
  # accepted house style; remove them from the ignore list (and sweep
  # the file) when preparing the upstream submission:
  #   BLOCK_COMMENT_STYLE — the /* ---- banner ---- */ section comments
  #   SPLIT_STRING        — user-visible strings split for 80 columns
  #   DEEP_INDENTATION    — dead-battery state machine nesting
  checkpatch:
    runs-on: ubuntu-latest
    env:
      KERNEL_TAG: v6.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetched from GitHub's mirror of torvalds/linux: kernel.org's
      # cgit frontend rejects fetches from GitHub-runner IPs (fast 4xx),
      # and the CI already runs on GitHub, so this adds no new
      # dependency.  Same files, same tag pin — verified byte-identical
      # to the kernel.org copies.
      - name: Fetch checkpatch.pl (${{ env.KERNEL_TAG }})
        run: |
          base="https://raw.githubusercontent.com/torvalds/linux/${KERNEL_TAG}/scripts"
          # --retry rides out transient raw.githubusercontent errors
          # (one observed 4xx flake failed the job on 2026-07-26).
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            curl -sf --retry 3 --retry-delay 2 --retry-all-errors \
              "${base}/${f}" -o "${RUNNER_TEMP}/${f}"
          done

      - name: checkpatch (--no-tree, documented ignores)
        run: |
          perl "${RUNNER_TEMP}/checkpatch.pl" --no-tree \
            --ignore BLOCK_COMMENT_STYLE,SPLIT_STRING,DEEP_INDENTATION \
            -f src/x120x.c

  # Compile the module against the kernel Raspberry Pi OS actually
  # ships — raspberrypi/linux rpi-6.12.y, cross-compiled for arm64
  # (Pi 5 bcm2712_defconfig).  The Ubuntu-header builds above catch
  # mainline API drift; this catches RPi-tree divergence.  The branch
  # head is deliberately unpinned: tracking what users are about to
  # run is the point of the job.  Slowest job (shallow kernel clone +
  # modules_prepare, ~5-10 min); deliberately uncached for simplicity.
  build-rpi:
    runs-on: ubuntu-latest
    env:
      RPI_BRANCH: rpi-6.12.y
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchain and kbuild deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu \
            flex bison bc libssl-dev libelf-dev

      - name: Clone raspberrypi/linux (${{ env.RPI_BRANCH }}, shallow)
        run: |
          git clone --depth 1 --branch "${RPI_BRANCH}" \
            https://github.com/raspberrypi/linux.git "${RUNNER_TEMP}/rpi-linux"
          git -C "${RUNNER_TEMP}/rpi-linux" log -1 --oneline

      - name: Prepare kernel tree (bcm2712_defconfig + modules_prepare)
        run: |
          make -C "${RUNNER_TEMP}/rpi-linux" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- bcm2712_defconfig
          make -C "${RUNNER_TEMP}/rpi-linux" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules_prepare

      # Compile-only (single-object kbuild target): modules_prepare
      # produces no Module.symvers — that needs a full kernel build —
      # so modpost would report every kernel-exported symbol as
      # undefined.  The CC stage with -Werror is the divergence check
      # this job exists for; full modpost already runs in the three
      # Ubuntu-header build jobs, whose packaged headers ship
      # Module.symvers.
      - name: Compile against ${{ env.RPI_BRANCH }} (-Werror, compile-only)
        run: |
          make -C "${RUNNER_TEMP}/rpi-linux" M="${GITHUB_WORKSPACE}/src" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-Werror x120x.o
          file "${GITHUB_WORKSPACE}/src/x120x.o"
